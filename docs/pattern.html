<script>
const $ = id => document.getElementById(id);
const DEMO = window.GHOST_DEMO || null;  // set only in the published demo (tools/build_demo.py)
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const CATS = ['Study', 'Work', 'Exercise', 'Nutrition', 'Self-care', 'Medication', 'Social media', 'Phone', 'TV & streaming', 'Internet browsing', 'Other'];
const OLD_CAT = {Study: 'Study', Work: 'Work', Health: 'Exercise'};
const ICON = {Study: 'i-book', Work: 'i-work', Exercise: 'i-shoe', Nutrition: 'i-apple', 'Self-care': 'i-heart', Medication: 'i-pill', 'Social media': 'i-chat', Phone: 'i-phone', 'TV & streaming': 'i-tv', 'Internet browsing': 'i-globe', Other: 'i-star'};
const PASTEL = {Study: '#cfd5ff', Work: '#dcdcea', Exercise: '#ffd3df', Nutrition: '#ffe0c2', 'Self-care': '#e4d9ff', Medication: '#c9eef3', 'Social media': '#ffd3df', Phone: '#e3e5f2', 'TV & streaming': '#ffd9c4', 'Internet browsing': '#cde8ee', Other: '#fff0a6'};
// The ten types. Each one is fed by the categories listed after it.
const TYPES = [
  {id: 'Bookworm', icon: 'i-book', bg: '#cfd5ff', from: ['Study']},
  {id: 'Builder', icon: 'i-work', bg: '#dcdcea', from: ['Work']},
  {id: 'Runner', icon: 'i-shoe', bg: '#ffd3df', from: ['Exercise']},
  {id: 'Chef', icon: 'i-apple', bg: '#ffe0c2', from: ['Nutrition']},
  {id: 'Zen master', icon: 'i-heart', bg: '#e4d9ff', from: ['Self-care']},
  {id: 'Butterfly', icon: 'i-chat', bg: '#ffd3df', from: ['Social media', 'Phone']},
  {id: 'Binger', icon: 'i-tv', bg: '#ffd9c4', from: ['TV & streaming']},
  {id: 'Explorer', icon: 'i-globe', bg: '#cde8ee', from: ['Internet browsing']},
  {id: 'Dreamer', icon: 'i-moon', bg: '#d5dcff', from: []},
  {id: 'Artist', icon: 'i-star', bg: '#fff0a6', from: ['Other']}
];
const STREAK_MIN = 15, DREAMER_HOURS = 8.5;

// Same saved data as the Ideas page (browser storage key ghost.v3).
function cleanAct(a){
  if (!a || !(+a.minutes > 0)) return null;
  const cat = CATS.includes(a.cat) ? a.cat : 'Other';
  return {cat, name: cat === 'Other' ? String(a.name || '').trim().slice(0, 60) : '', minutes: Math.min(Math.round(+a.minutes), 1440), desc: String(a.desc || '').trim().slice(0, 140)};
}
function normDays(list){
  const by = {};
  (Array.isArray(list) ? list : []).forEach(d => {
    if (!d || !d.date) return;
    const e = by[d.date] || (by[d.date] = {date: d.date, acts: [], sleep: null, feel: null});
    if (Array.isArray(d.acts)) e.acts = d.acts.map(cleanAct).filter(Boolean);
    else if (+d.minutes > 0) e.acts.push(OLD_CAT[d.area] ? {cat: OLD_CAT[d.area], name: '', minutes: Math.round(+d.minutes), desc: String(d.text || '').slice(0, 140)} : {cat: 'Other', name: String(d.text || d.area || '').slice(0, 60), minutes: Math.round(+d.minutes), desc: ''});
    if (d.sleep !== undefined && d.sleep !== null) e.sleep = +d.sleep;
    if (+d.feel >= 1 && +d.feel <= 5) e.feel = +d.feel;
  });
  return Object.values(by).sort((a, b) => a.date.localeCompare(b.date));
}
let saved = {};
for (const k of ['ghost.v3', 'ghost.v2']){ try { const raw = localStorage.getItem(k); if (raw){ saved = JSON.parse(raw) || {}; break; } } catch(e){} }
const days = normDays(saved.days).filter(d => d.acts.length);

const fmtMin = m => { const h = Math.floor(m / 60), r = m % 60; return [h ? h + ' h' : '', r || !h ? r + ' min' : ''].filter(Boolean).join(' '); };
const fmtPct = x => x > 0 && x < 0.5 ? '<1%' : Math.round(x) + '%';
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;

// Totals per category, over every logged day.
const total = {}; let all = 0;
days.forEach(d => d.acts.forEach(a => { total[a.cat] = (total[a.cat] || 0) + a.minutes; all += a.minutes; }));
const ranked = Object.keys(total).sort((a, b) => total[b] - total[a]).slice(0, 8);
const share = c => 100 * total[c] / all;

function detail(cat){
  const withDays = days.filter(d => d.acts.some(a => a.cat === cat)), without = days.filter(d => !d.acts.some(a => a.cat === cat));
  const said = [], seen = new Set();
  days.slice().reverse().forEach(d => d.acts.filter(a => a.cat === cat).forEach(a => {
    const t = (cat === 'Other' ? [a.name, a.desc].filter(Boolean).join(': ') : a.desc);
    const k = t.toLowerCase(); if (t && !seen.has(k)){ seen.add(k); said.push(t); }
  }));
  const f = list => list.filter(d => d.feel).map(d => d.feel);
  return {minutes: total[cat], nDays: withDays.length, said: said.slice(0, 3), feelWith: f(withDays).length ? avg(f(withDays)) : null, feelWithout: f(without).length ? avg(f(without)) : null};
}

// ---- Balls
const ballEls = {}; let selected = ranked[0];
function diameter(c, scale){ return Math.round((64 + share(c) * 3.2) * scale); }
function makeBall(c, i){
  const b = el('button', 'ball'); b.type = 'button'; b.style.setProperty('--i', i); b.style.background = PASTEL[c];
  b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', c + ', ' + fmtPct(share(c)) + ' of your logged time');
  b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#' + ICON[c] + '"/></svg>'; b.append(el('span', 'pc', fmtPct(share(c))));
  b.onclick = () => select(c); ballEls[c] = b; return b;
}
function renderPop(){
  const c = selected, d = detail(c), pop = $('pop'); pop.textContent = '';
  pop.append(el('h3', '', c), el('div', 'n', fmtPct(share(c))));
  pop.append(el('p', '', 'of your logged time: ' + fmtMin(d.minutes) + ' over ' + d.nDays + (d.nDays === 1 ? ' day.' : ' days.')));
  if (d.said.length){ const p = el('p'); p.append(el('b', '', 'You wrote: '), d.said.join(', ') + '.'); pop.append(p); }
  if (d.feelWith !== null){
    const p = el('p'); p.append('Felt ', el('b', '', d.feelWith.toFixed(1) + ' / 5'), ' on those days');
    if (d.feelWithout !== null){ p.append(', ', el('b', '', d.feelWithout.toFixed(1)), ' on the others'); }
    p.append('.'); pop.append(p);
  }
  placePop();
}
function select(c){
  selected = c;
  Object.entries(ballEls).forEach(([k, b]) => b.setAttribute('aria-pressed', String(k === c)));
  renderPop();
}
let pos = {};   // centre and size of each ball in the wide layout
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layout(){
  const stage = $('stage'), W = stage.clientWidth, narrow = W < 900;
  stage.classList.toggle('flow', narrow);
  const balls = $('balls'), arcs = $('arcs'); arcs.textContent = '';
  if (narrow){
    ranked.forEach(c => { const d = Math.min(diameter(c, 1), 150); Object.assign(ballEls[c].style, {width: d + 'px', height: d + 'px', left: '', top: ''}); });
    $('ghostEl').style.cssText = 'width:150px;height:136px';
    renderPop(); return;
  }
  const H = 600, popW = 310, areaW = W - popW - 40, gx = areaW / 2, gy = H - 86;
  $('ghostEl').setAttribute('style', 'left:' + (gx - 95) + 'px;top:' + (gy - 86) + 'px');
  const avoid = {x: gx - 105, y: gy - 100, w: 210, h: 200};
  let scale = 1, placed;
  for (let round = 0; round < 6; round++){
    placed = []; let ok = true; const rnd = mulberry32(7 + round);
    for (const c of ranked){
      const d = diameter(c, scale); let spot = null;
      for (let t = 0; t < 500 && !spot; t++){
        const x = 12 + rnd() * (areaW - d - 24), y = 14 + rnd() * (H - d - 40);
        const clash = r => x < r.x + r.w + 26 && x + d + 26 > r.x && y < r.y + r.h + 34 && y + d + 34 > r.y;
        if (!clash(avoid) && !placed.some(clash)) spot = {x, y, w: d, h: d, c};
      }
      if (!spot){ ok = false; break; }
      placed.push(spot);
    }
    if (ok) break; scale *= .88;
  }
  pos = {};
  placed.forEach(p => { pos[p.c] = p; Object.assign(ballEls[p.c].style, {width: p.w + 'px', height: p.h + 'px', left: p.x + 'px', top: p.y + 'px'}); });
  // dotted arcs from the ghost to the biggest balls
  const NS = 'http://www.w3.org/2000/svg';
  placed.slice(0, 3).forEach((p, i) => {
    const sx = gx + (i - 1) * 50, sy = gy - 84, ex = p.x + p.w / 2, ey = p.y + p.h + 4;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M' + sx + ' ' + sy + ' C ' + sx + ' ' + (sy - 140) + ', ' + ex + ' ' + (ey + 160) + ', ' + ex + ' ' + ey);
    arcs.append(path);
  });
  placePop();
}
function placePop(){
  const pop = $('pop'), stage = $('stage');
  if (stage.classList.contains('flow')) { pop.style.top = ''; return; }
  const p = pos[selected], H = stage.clientHeight, ph = pop.offsetHeight;
  const cy = p ? p.y + p.h / 2 : 100, top = Math.max(0, Math.min(H - ph, cy - ph / 2));
  pop.style.top = top + 'px'; pop.style.setProperty('--tail', Math.max(18, Math.min(ph - 44, cy - top - 13)) + 'px');
}

// ---- Type bar
function archetypes(){
  const sums = TYPES.map(t => ({t, m: t.from.reduce((s, c) => s + (total[c] || 0), 0)}));
  const sleeps = days.filter(d => d.sleep !== null).map(d => d.sleep);
  const dreamer = sleeps.length && avg(sleeps) >= DREAMER_HOURS;
  const ordered = sums.filter(x => x.m > 0).sort((a, b) => b.m - a.m);
  const main = ordered[0] ? ordered[0].t : (dreamer ? TYPES.find(t => t.id === 'Dreamer') : null);
  let streak = ordered.find(x => x.t !== main && 100 * x.m / all >= STREAK_MIN);
  streak = streak ? streak.t : (dreamer && main && main.id !== 'Dreamer' ? TYPES.find(t => t.id === 'Dreamer') : null);
  return {main, streak};
}
function renderArch(){
  const {main, streak} = archetypes(), t = $('archT'); t.textContent = '';
  if (main){
    t.append('You are mostly ', el('mark', '', 'The ' + main.id));
    t.append(streak ? ', with a ' + streak.id + ' streak.' : '.');
  }
  $('archPer').textContent = 'from your ' + days.length + ' logged ' + (days.length === 1 ? 'day' : 'days');
  const toks = $('toks'); toks.textContent = '';
  TYPES.forEach(ty => {
    const me = ty === main, mid = ty === streak, size = me ? 84 : mid ? 66 : 48;
    const d = el('div', 'tk' + (me ? ' me' : '')), c = el('div', 'c'); c.style.cssText = 'width:' + size + 'px;height:' + size + 'px;background:' + ty.bg;
    c.innerHTML = '<svg aria-hidden="true"><use href="#' + ty.icon + '"/></svg>';
    d.title = 'The ' + ty.id + (ty.from.length ? ': ' + ty.from.join(' and ') : ': average sleep of ' + DREAMER_HOURS + ' hours or more');
    d.append(c, el('div', '', ty.id)); if (me) d.append(el('div', 'mk', '\u25B2'));
    toks.append(d);
  });
}

function sampleDays(){
  const d = (n, acts, sleep, feel) => ({date: new Date(Date.now() - n * 864e5 - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10), acts, sleep, feel});
  const a = (cat, minutes, desc, name = '') => ({cat, name, minutes, desc});
  return [d(5, [a('Study', 120, 'quant finance book'), a('Social media', 90, 'scrolling')], 6.5, 3), d(4, [a('Study', 100, 'notes'), a('Exercise', 40, 'easy run')], 7, 4),
    d(3, [a('Work', 240, 'job applications'), a('Exercise', 45, 'easy run with strides')], 7.5, 4), d(2, [a('Study', 60, 'chapter review'), a('Other', 45, 'scales', 'Guitar'), a('Exercise', 50, 'long run')], 8, 5),
    d(1, [a('Work', 200, 'job applications'), a('Nutrition', 30, 'meal prep')], 7, 4), d(0, [a('Study', 90, 'chapter 3'), a('Exercise', 45, '5 km easy run')], 7.5, 4)];
}
function render(){
  if (!days.length){
    $('empty').hidden = false;
    if (DEMO){ $('sample').hidden = false; $('sample').onclick = () => { try { const cur = JSON.parse(localStorage.getItem('ghost.v3') || '{}') || {}; cur.days = sampleDays(); localStorage.setItem('ghost.v3', JSON.stringify(cur)); } catch(e){} location.reload(); }; }
    return;
  }
  $('full').hidden = false;
  const balls = $('balls');
  ranked.forEach((c, i) => balls.append(makeBall(c, i)));
  renderArch(); layout(); select(selected);
}
render();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('full').hidden) layout(); }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('full').hidden) layout(); });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
